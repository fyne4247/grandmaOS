# GrandmaOS (2026-10-14): do not start X before the real GPU driver is ready.
#
# On the Dell XPS 13 (Panther Lake / xe), xe removes the boot-time simpledrm
# card about a second before it registers its own, and LightDM started Xorg in
# that gap: every boot Xorg aborted twice ("open /dev/dri/card0: No such file
# or directory", "no screens found") before a systemd restart succeeded.
# LightDM's logind-check-graphical did not help because seat0 was already
# graphical from simpledrm. Wait (at most 10 s) for a DRM card bound to a
# driver other than simple-framebuffer, then continue regardless.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $$i -lt 100 ]; do for c in /sys/class/drm/card[0-9]*; do case "$$c" in *-*) continue ;; esac; d=$$(basename "$$(readlink -f "$$c/device/driver" 2>/dev/null)"); [ -n "$$d" ] && [ "$$d" != simple-framebuffer ] && exit 0; done; sleep 0.1; i=$$((i+1)); done; echo "grandmaos: no GPU DRM card after 10s; starting anyway"; exit 0'
