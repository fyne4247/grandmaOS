# GrandmaOS (2026-09-19): do NOT suspend on lid close.
#
# On this hardware (Dell XPS 13, Panther Lake / xe display driver, Xorg
# 21.1.12), a lid-triggered s2idle suspend races the display driver and Xorg.
# Instead of sleeping we get an "Xorg FatalError / no screens found" core dump
# and an immediate reboot. Grandma shuts the lid, the machine appears to wake
# and reboot itself.
#
# Temporary measure until the driver issue is fixed: ignore the lid switch.
# This is the root-side half of the fix; the user-side half sets the XFCE power
# manager lid action to "do nothing" (see files/sbin/grandma-apply-baseline).
# Remove this file to restore the distro default (HandleLidSwitch=suspend).
#
# Reference: systemd-logind(8), logind.conf(5).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore