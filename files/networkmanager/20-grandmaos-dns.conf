[main]
# NetworkManager's dnsmasq plugin supports a narrow per-domain upstream while
# retaining the connection's AdGuard Family servers for every other lookup.
dns=dnsmasq
# /etc/resolv.conf remains the systemd-resolved stub by design; do not invoke
# the legacy resolvconf helper in parallel.
rc-manager=unmanaged
# systemd-resolved is deliberately kept as the system stub, but it forwards to
# this dnsmasq instance via the GrandmaOS resolved drop-in instead of receiving
# the raw connection DNS servers directly from NetworkManager.
systemd-resolved=false
