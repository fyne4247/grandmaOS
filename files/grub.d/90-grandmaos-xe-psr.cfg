# GrandmaOS (2026-10-14): disable eDP PSR and Panel Replay on the xe driver.
#
# Dell XPS 13 (Panther Lake, xe, LG panel 2560x1600) evidence before this:
# "Selective fetch area calculation failed in pipe A" on every boot,
# "*ERROR* Timed out waiting for PSR Idle for re-enable", garbage flicker
# during normal use, and silent resets with no kernel log. xe.enable_psr=0
# alone left "Panel Replay Selective Update" active, so both are required.
# Verify with: sudo cat /sys/kernel/debug/dri/*/i915_edp_psr_status
# ("PSR mode: disabled"). Costs some battery life.
#
# Undo: delete /etc/default/grub.d/90-grandmaos-xe-psr.cfg and run
# `sudo update-grub`.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT xe.enable_psr=0 xe.enable_panel_replay=0"
